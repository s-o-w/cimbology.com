name: Deploy cimbology.com to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      - name: Install site dependencies
        working-directory: explorer
        run: npm ci

      - name: Verify hosted ontologies
        working-directory: explorer
        run: npm run verify:ontologies

      - name: Generate CIM Explorer docs and build full Starlight site
        working-directory: explorer
        run: |
          npm run generate
          npm run build
          npm run verify:explorer

      - name: Assemble GitHub Pages artifact (_site)
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a explorer/dist/ _site/
          cp CNAME _site/CNAME
          mkdir -p _site/ontology
          rsync -a ontology/ _site/ontology/
          touch _site/.nojekyll

      - name: Smoke-check assembled _site
        run: |
          set -euo pipefail
          for f in \
            "_site/CNAME" \
            "_site/.nojekyll" \
            "_site/index.html" \
            "_site/about/index.html" \
            "_site/blog/index.html" \
            "_site/blog/rss.xml" \
            "_site/research/provenance/index.html" \
            "_site/research/cimbology-kg/index.html" \
            "_site/research/why-cim-matters/index.html" \
            "_site/research/cimbology-graphrag/index.html" \
            "_site/research/dottc57/index.html" \
            "_site/research/ai-and-engineering/index.html" \
            "_site/why-cim-matters.html" \
            "_site/dotTC57.html" \
            "_site/cimbology-case-study.html" \
            "_site/ai-philosophy.html" \
            "_site/ontology/iec61970.ttl" \
            "_site/ontology/iec61968.ttl" \
            "_site/ontology/cim100.ttl" \
            "_site/ontology/cimbology-kg.ttl" \
            "_site/ontology/cim-model.json" \
            "_site/cim/index.html" \
            "_site/cim/iec61970/base/wires/breaker/index.html" \
            "_site/cim/cimbology-kg/classes/foundation/index.html" \
            "_site/pagefind/pagefind.js"; do
            if [ ! -f "$f" ]; then
              echo "MISSING required Pages artifact file: $f" >&2
              exit 1
            fi
          done
          echo "Pages artifact smoke-check PASSED."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
